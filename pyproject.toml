[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbook"
version = "0.2.0"
description = "把公开视频变成能读的电子书（EPUB3）——本地转写、自动切章、图文配图"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bbook contributors" }]
keywords = ["bilibili", "youtube", "epub", "whisper", "asr", "ebook", "transcript"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "requests>=2.28",          # 模型下载 / cookie 检测
  "Pillow>=9.0",             # 封面生成
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]        # 本地转写（免费、离线）
ocr = ["rapidocr-onnxruntime>=1.3"]  # 幻灯片识别配图
all = ["faster-whisper>=1.0", "rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
bbook = "bbook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bbook"]
